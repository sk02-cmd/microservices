apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microservices-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/sk02-cmd/microservices.git
    targetRevision: HEAD
    path: .

  destination:
    server: https://kubernetes.default.svc
    namespace: demo-microservices

  syncPolicy:
    automated:
      prune: true
      selfHeal: true